            min-height: 100vh;
            display: flex;

            align-items: center;

        /* Градиентный фон как на cloudpub */
        body::before {

                        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.8) 70%, #0d0d0d 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;

        }

        /* Шапка в стиле cloudpub */
        .header {

            margin-bottom: 28px;
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 4px;
        }

        .logo span {
            color: #6c5ce7;
        }

        .tagline {
            color: #888;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Основная карточка */
        .download-card {
            background: #1a1a1f;
            border-radius: 18px;
            padding: 38px 32px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(108, 92, 231, 0.3);
            border: 1px solid #2a2a35;
            text-align: center;
        }

        .file-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #6c5ce7, #5a4bd4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .file-name {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            word-break: break-all;
            line-height: 1.4;
        }

        .file-meta {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(145deg, #6c5ce7, #5a4bd4);
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.25s;
            margin-bottom: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }

        .download-btn:hover {
            background: linear-gradient(145deg, #7c6df0, #6a5ae4);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(108, 92, 231, 0.55);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Футер */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .download-card {
                padding: 25px 18px;
            }
            .file-name {
                font-size: 14px;
            }
            .logo {
                font-size: 30px;
            }
        }
    </style>
</head>
