<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATALITY CRACK - CS2</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .box {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #a855f7;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        h1 {
            color: #a855f7;
            font-size: 32px;
            margin-bottom: 5px;
            text-transform: uppercase;

            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            background: #a855f7;
            color: #fff;
            padding: 15px 50px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover {
            background: #9333ea;
            transform: scale(1.05);
        }
        .pass-box {
            background: #0d0d0d;
            border: 1px dashed #a855f7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 25px;
        }
        .pass-label {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .pass {
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;

<body>

        <div class="pass-box">
            <div class="pass-label">🔑 Пароль от архива:</div>
            <div class="pass">fatality</div>

</html>
